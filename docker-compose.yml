services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: S3cureLocalDemoPass!
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "appuser", "-d", "appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./app
    environment:
      APP_MESSAGE: "Hello World from Docker Compose"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: S3cureLocalDemoPass!
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
